<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growlog</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="center">
        <h1 id="Growlog">Growlog</h1>
        <div class="tracker"></div>
    </div>

    <div class="main-container">
        
        <div id="box">
            <div class="sidebar-header">
                <button id="tasks-tab-btn" class="nav-tab-button active">Tasks</button>
                <button id="journal-tab-btn" class="nav-tab-button">Journal</button>
            </div>

            <div id="tasks-sidebar" class="left">
                <button id="addtaskbtn" class="basic-buttons">+ Add New Task</button>
                <div id="inputbox" class="card hidden">
                    <input type="text" id="taskinput" placeholder="Enter Task Name..">
                    <div class="card-actions">
                        <button id="confirmbtn" class="basic-buttons confirmbtn">Confirm</button>
                        <button id="cancelbtn" class="basic-buttons cancelbtn">Cancel</button>
                    </div>
                </div>
            </div>

            <div id="journal-sidebar" class="left hidden">
                <button id="addentrybtn" class="basic-buttons">+ New Entry</button>
            </div>
        </div>

        <div id="tasks-view" class="tasks-board">
            <div id="tasklist"></div>
            <div id="completed-section" class="hidden">
                <h3 class="section-title">Completed Tasks</h3>
                <div id="completedlist"></div>
            </div>   
        </div>

        <div id="journal-view" class="journal-board hidden">
            <div class="journal-card">
                <input type="text" class="journal-title-input" placeholder="Title of your entry..">
                
                <!-- formatting toolbar -->
                <div class="format-toolbar">
                    <button type="button" class="toolbar-btn" data-cmd="bold"><b>B</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="italic"><b>I</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="underline"><b>U</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="insertUnorderedList">&bull; List</button>
                </div>

                <!--editable text writing area (rich text)-->
                <div class="journal-editor" contenteditable="true" data-placeholder="Start Writing.."></div>
            </div>
        </div>
    </div>

</body>
</html>
