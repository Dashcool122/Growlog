<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growlog</title>
    <link rel = "stylesheet" href = "style.css">
    <script src = "script.js" defer></script>
</head>
<body>
    
    
    <div class="center">
        
        <h1 id="Growlog">Growlog</h1>
        <div class="tracker">
        </div>
    </div>

<div id="box">
    <h2 id="Routines">Routines</h2>
        <div class="left">
        <button id="addroutinebtn" class="basic-buttons">+ Add New Routine</button>
        <button id="removeroutinebtn" class="basic-buttons">- Remove a Routine</button>

        <div id="inputbox" class="card hidden">
            <input type="text" id="routineinput" placeholder="Enter Routine Name..">
            <div class="card-actions">
                <button id="confirmbtn" class="basic-buttons confirmbtn">Confirm</button>
                <button id="cancelbtn" class="basic-buttons cancelbtn">Cancel</button>
            </div>
        </div>
    </div>
    
    <div id="routinelist"></div>
</div>




</body>
</html>
