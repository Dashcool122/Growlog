<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growlog</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="center">
        <h1 id="Growlog">Growlog</h1>
        <div class="tracker"></div>
    </div>

    <div class="main-container">
        <!-- box controls -->
        <div id="box">
            <div class="sidebar-header">
                <button id="tasks-tab-btn" class="nav-tab-button active">Tasks</button>
                <button id="journal-tab-btn" class="nav-tab-button">Journal</button>
            </div>

            <div id="tasks-sidebar" class="left">
                <button id="addtaskbtn" class="basic-buttons">+ New Task</button>
                
                <div id="inputbox" class="card hidden">
                    <input type="text" id="taskinput" placeholder="Enter Task Name..">
                    <div class="card-actions">
                        <button id="confirmbtn" class="basic-buttons confirmbtn">Confirm</button>
                        <button id="cancelbtn" class="basic-buttons cancelbtn">Cancel</button>
                    </div>
                </div>

                <div class="progress-card">
    <div class="progress-header">
        <span>Today's Progress</span>
        <span id="progress-percent">0%</span>
    </div>
    <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>
    <p id="progress-count" class="progress-count">0 tasks completed</p>
</div>
            </div>

            <div id="journal-sidebar" class="journal-sidebar left hidden">
                <button id="new-entry-btn" class="entry-add-btn">+ New Entry</button>
                <div id="journal-list" class="journal-entries-list"></div>
            </div>
        </div>

        <!-- tasks controls -->
        <div id="tasks-view" class="tasks-board">
            <div id="empty-tasks-state" class="empty-state hidden">
                <div class="empty-plant-icon">🌱</div>
                <h3 class="empty-title">All clear!</h3>
                <p class="empty-subtitle">Your garden is resting. Add a task to start growing.</p>
            </div>
            <div id="tasklist"></div>
            <div id="completed-section" class="hidden">
                <h3 class="section-title">Completed Tasks</h3>
                <div id="completedlist"></div>
            </div>   
        </div>

        <!-- journal workspace -->
        <div id="journal-view" class="journal-board hidden">
            <div class="journal-card" id="journal-editor-card">
                <div class="journal-card-top">
                    <input type="text" id="journal-title" class="journal-title-input" placeholder="Title of your entry..">
                    <button id="delete-entry-btn" class="delete-entry-btn" title="Delete Entry">🗑️</button>
                </div>
                
                <!-- formatting toolbar -->
                <div class="format-toolbar">
                    <button type="button" class="toolbar-btn" data-cmd="bold"><b>B</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="italic"><b>I</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="underline"><b>U</b></button>
                    <button type="button" class="toolbar-btn" data-cmd="insertUnorderedList">&bull; List</button>
                </div>

                <!-- editable text writing area (rich text) -->
                <div id="journal-body" class="journal-editor" contenteditable="true" data-placeholder="Start Writing.."></div>
            </div>
        </div>
    </div>

</body>
</html>
